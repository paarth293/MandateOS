name: MandateOS CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Quality & Cryptographic Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install project dependencies
        run: npm ci

      - name: Run Biome linter & formatting check
        run: npx @biomejs/biome check .

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest unit & integration test suite
        run: npm test

      - name: Verify Next.js production build
        run: npm run build
        env:
          DATABASE_URL: postgresql://mock:mock@localhost:5432/mock
          NEXT_PUBLIC_APP_URL: http://localhost:3000
        # NOTE: AGENT_SECRET_KEY / AGENT_KEY_PATH must NOT be set here — the audit
        # chain export route reads them at request time, and a hardcoded key in
        # CI/source would make exported "signatures" forgeable. Leave unset.
